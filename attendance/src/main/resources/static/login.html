<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Classroom Attendance System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .login-container h1 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-container input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-container input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #173a5e;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .demo-login {
            margin-top: 20px;
            padding: 12px;
            background: #f4f6f8;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>
        Classroom Attendance
    </h1>

    <p>
        Teacher / Admin Login
    </p>


    <form id="loginForm">

        <input
                type="text"
                id="username"
                placeholder="Username"
                required>


        <input
                type="password"
                id="password"
                placeholder="Password"
                required>


        <button
                type="submit"
                class="login-btn">

            Login

        </button>

    </form>


    <div id="message"></div>


    <div class="demo-login">

        <strong>Demo Login</strong>

        <br>

        Username: admin

        <br>

        Password: admin123

    </div>

</div>


<script>

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "username"
                    ).value;


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const message =
                    document.getElementById(
                        "message"
                    );


                if (
                    username === "admin" &&
                    password === "admin123"
                ) {

                    message.style.color =
                        "green";

                    message.textContent =
                        "Login successful";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/index.html";

                        },
                        500
                    );

                }
                else {

                    message.style.color =
                        "red";

                    message.textContent =
                        "Invalid username or password";

                }

            }
        );

</script>


</body>

</html>
